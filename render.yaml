# PREDATOR v13.0 SINGULARITY - Render Blueprint
# Custo Zero | Deploy Automático

services:
  - type: web
    name: predador-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cloud_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TZ
        value: "America/Sao_Paulo"
