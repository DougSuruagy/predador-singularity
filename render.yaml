# PREDADOR v370.3 DUAL-CORE - Render Blueprint
services:
  # -----------------------------------------------------------------
  # 🦅 PRIMARY NODE (Frankfurt) - Trading Engine
  # -----------------------------------------------------------------
  - type: web
    name: predador-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cloud_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_ROLE
        value: "PRIMARY"

  # -----------------------------------------------------------------
  # 🧠 BRAIN NODE (Virginia) - Watchdog & Analytics
  # -----------------------------------------------------------------
  - type: web
    name: predador-singularity-m32c
    runtime: python
    region: oregon 
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cloud_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_ROLE
        value: "BRAIN"
